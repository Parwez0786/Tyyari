server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: admin-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/admin_db}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8083}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
  kafka:
    audit-events-topic: audit-events
