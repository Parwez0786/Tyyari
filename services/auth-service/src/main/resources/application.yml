server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-http-form-post-size: 1MB

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/auth_db}
      auto-index-creation: false
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
  issuer: ${JWT_ISSUER:interview-platform}
  access-token-seconds: 900
  refresh-token-days: 7

app:
  kafka:
    user-events-topic: user-events
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:Tyyari <noreply@tyyari.dev>}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/github}
  billing:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${PREMIUM_CURRENCY:inr}
    amount: ${PREMIUM_AMOUNT:49900}
    product-name: ${PREMIUM_PRODUCT_NAME:Tyyari Premium}
