services:
  mongo:
    image: mongo:7
    container_name: tyyari-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: tyyari-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    container_name: tyyari-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: tyyari-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: tyyari-mailpit
    ports:
      - "8026:8025"

  auth-service:
    build: ./services/auth-service
    container_name: tyyari-auth
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/auth_db
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "false"
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-interview-platform}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: "${MAIL_FROM:-Tyyari <noreply@tyyari.dev>}"
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/github}
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    container_name: tyyari-user
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/user_db
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  content-service:
    build: ./services/content-service
    container_name: tyyari-content
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/content_db
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "false"
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  admin-service:
    build: ./services/admin-service
    container_name: tyyari-admin-api
    environment:
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/admin_db
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      CONTENT_SERVICE_URL: http://content-service:8083
      USER_SERVICE_URL: http://user-service:8082
    ports:
      - "8084:8084"
    depends_on:
      - auth-service
      - content-service
      - user-service
      - kafka

  api-gateway:
    build: ./services/api-gateway
    container_name: tyyari-gateway
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-interview-platform}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CONTENT_SERVICE_URL: http://content-service:8083
      ADMIN_SERVICE_URL: http://admin-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - content-service
      - admin-service
      - redis

  code-runner:
    build: ./services/code-runner
    container_name: tyyari-runner
    environment:
      PORT: 2000
      RUNNER_TIMEOUT_MS: 30000
    ports:
      - "2000:2000"
    tmpfs:
      - /tmp:exec,size=512m,uid=65534,gid=65534
    mem_limit: 2g
    pids_limit: 512
    read_only: true
    security_opt:
      - no-new-privileges:true

  web:
    build: ./frontend/web
    container_name: tyyari-web
    environment:
      VITE_API_URL: http://localhost:8080
      PISTON_URL: http://code-runner:2000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api-gateway
      - code-runner

  admin:
    build: ./frontend/admin
    container_name: tyyari-admin
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  redis_data:
